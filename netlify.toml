[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Public browser keys that must be in the page code (Firebase web API key, EmailJS public key).
  # They are not secrets, so exempt just these two values from Netlify's secrets scan.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBQiE4TlMIcO6iyCob2G1js3eEVcmmjNmI,nZQzXeztAmkfMPwzS"
