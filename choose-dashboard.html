<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gold Coast Auto Parts — Choose Dashboard</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./favicon.png">
<style>
:root {
  color-scheme: dark;
  --void: #07070a;
  --glass: rgba(255,255,255,0.045);
  --glass-border: rgba(255,255,255,0.10); --glass-border-gold: rgba(212,164,65,0.45);
  --gold: #d4a441; --gold-2: #f2d38a; --gold-ink: #1a1305;
  --blue: #60a5fa; --green: #34d399;
  --text: #f3f1ec; --text-soft: #a39d94;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0px; background: var(--void); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  background: radial-gradient(ellipse 900px 700px at 15% 0%, rgba(212,164,65,0.20), transparent 60%), radial-gradient(ellipse 800px 600px at 100% 100%, rgba(167,139,250,0.12), transparent 60%), var(--void); }
.card { background: rgba(20,17,12,0.78); backdrop-filter: blur(34px) saturate(160%); -webkit-backdrop-filter: blur(34px) saturate(160%); border: 1px solid var(--glass-border-gold); border-radius: 20px; padding: 30px 26px; max-width: 420px; width: 100%; box-shadow: 0 28px 90px rgba(0,0,0,0.6), 0 0 60px rgba(212,164,65,0.08); text-align: center; }
.logo-wrap { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border-gold); border-radius: 12px; padding: 14px 10px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; }
.logo-wrap img { height: 40px; width: auto; display: block; }
h1 { font-size: 16px; margin: 0 0 4px; color: var(--text); }
.sub { font-size: 13px; color: var(--text-soft); margin-bottom: 22px; }
.choice-btn { display: block; width: 100%; border: 1.5px solid var(--glass-border); background: rgba(255,255,255,0.05); color: var(--text); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; font-size: 14.5px; font-weight: 700; cursor: pointer; text-align: left; transition: all 0.15s; }
.choice-btn .icon { font-size: 20px; margin-right: 10px; }
.choice-btn .desc { display: block; font-size: 11.5px; font-weight: 500; color: var(--text-soft); margin-top: 3px; }
.choice-btn:hover { border-color: var(--glass-border-gold); background: rgba(212,164,65,0.10); transform: translateY(-1px); }
.choice-btn.gold { background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: var(--gold-ink); border-color: transparent; }
.choice-btn.gold .desc { color: rgba(26,19,5,0.7); }
.logout-link { display: block; margin-top: 6px; font-size: 12px; color: var(--blue); cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap"><img src="gca-logo.png" alt="Gold Coast Auto Parts"></div>
  <h1 id="welcomeMsg">Welcome</h1>
  <div class="sub">Which dashboard would you like to open?</div>
  <button class="choice-btn gold" onclick="location.href='index.html'"><span class="icon">🚚</span>Delivery Status Board<span class="desc">Today's delivery stops, live driver tracking</span></button>
  <button class="choice-btn" onclick="location.href='sales-routes.html'"><span class="icon">🧾</span>Sales Representative Routes<span class="desc">Today's sales visits, live rep tracking</span></button>
  <a class="logout-link" onclick="doLogout()">Log Out</a>
</div>
<script>
function loadSession() {
  try { return JSON.parse(localStorage.getItem('kgps_session')) || null; } catch(e) { return null; }
}
var session = loadSession();
if (!session) {
  window.location.href = 'index.html';
} else if (session.type === 'guest' && !session.isAdmin && session.role === 'Driver') {
  window.location.href = 'index.html';
} else if (session.type === 'guest' && !session.isAdmin && session.role === 'Sales Rep') {
  window.location.href = 'sales-routes.html';
} else {
  document.getElementById('welcomeMsg').textContent = 'Welcome, ' + (session.name || 'there') + '!';
}
function doLogout() {
  localStorage.removeItem('kgps_session');
  window.location.href = 'index.html';
}
</script>
</body>
</html>
